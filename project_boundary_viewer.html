<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>八项森林工程交互总览</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html,body,#map{width:100%;height:100%;margin:0}body{font-family:"Microsoft YaHei",sans-serif;background:#eef1eb}.leaflet-container{background:#eef1eb}
    .guide{position:absolute;z-index:800;left:18px;top:18px;width:min(365px,calc(100% - 36px));padding:14px 16px;border:1px solid rgba(42,75,60,.16);border-radius:8px;background:rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(31,62,48,.18);backdrop-filter:blur(8px)}
    h1{margin:0 0 6px;font-size:18px;color:#173d2b}.guide p{margin:0;color:#63726a;font-size:12px;line-height:1.65}.status{margin-top:8px!important;color:#315d47!important;font-weight:700}.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:11px}.item{display:flex;gap:7px;align-items:center;color:#46564e;font-size:11px}.sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto}
    @media(max-width:640px){.guide{left:10px;top:10px;width:calc(100% - 20px);padding:10px 12px}.legend{display:none}h1{font-size:16px}}
  </style>
</head>
<body><div id="map"></div><section class="guide"><h1>八种环境，八种守护</h1><p>移动鼠标查看工程名称；点击任一彩色工程区，进入对应专题网页。</p><p id="status" class="status">请选择地图中的彩色区域</p><div id="legend" class="legend"></div></section>
<script>
const projects={
 "三北防护林体系建设工程":{c:"#C98B2E",u:"01_sanbei_三北防护林体系建设工程.html",s:"三北防护林"},
 "太行山绿化工程":{c:"#607D45",u:"02_taihang_太行山绿化工程.html",s:"太行山绿化"},
 "辽河流域防护林体系建设工程":{c:"#3C92A8",u:"03_liaohe_辽河流域防护林体系建设工程.html",s:"辽河流域防护林"},
 "黄河中游防护林体系建设工程":{c:"#B46A3C",u:"04_huanghe_黄河中游防护林体系建设工程.html",s:"黄河中游防护林"},
 "淮河太湖流域防护林体系建设工程":{c:"#5A9F78",u:"05_huaihu_淮河太湖流域防护林体系建设工程.html",s:"淮河太湖防护林"},
 "长江中上游防护林体系建设工程":{c:"#2F6F73",u:"06_changjiang_长江中上游防护林体系建设工程.html",s:"长江中上游防护林"},
 "珠江流域防护林体系建设工程":{c:"#3FA56B",u:"07_zhujiang_珠江流域防护林体系建设工程.html",s:"珠江流域防护林"},
 "沿海防护林体系建设工程":{c:"#4C78A8",u:"08_yanhai_沿海防护林体系建设工程.html",s:"沿海防护林"}
};
const legend=document.getElementById("legend"),status=document.getElementById("status");
Object.entries(projects).forEach(([n,v])=>legend.insertAdjacentHTML("beforeend",`<div class="item"><i class="sw" style="background:${v.c}"></i><span>${v.s}</span></div>`));
const map=L.map("map",{zoomControl:true,minZoom:3,maxZoom:10});
L.tileLayer("https://map.geoq.cn/ArcGIS/rest/services/ChinaOnlineCommunity/MapServer/tile/{z}/{y}/{x}",{attribution:"GeoQ 全国基础底图"}).addTo(map);
fetch("projects.geojson").then(r=>r.json()).then(data=>{
 const layer=L.geoJSON(data,{style:f=>{const p=projects[f.properties.PROJ_NAME];return{color:p?.c||"#67776e",weight:1.6,fillColor:p?.c||"#67776e",fillOpacity:.68}},onEachFeature:(f,l)=>{
   const name=f.properties.PROJ_NAME,p=projects[name]; if(!p)return;
   l.bindTooltip(name,{sticky:true,direction:"top",opacity:.95});
   l.on({mouseover:e=>{e.target.setStyle({weight:3,fillOpacity:.84});e.target.bringToFront();status.textContent="点击进入："+name},mouseout:e=>{layer.resetStyle(e.target);status.textContent="请选择地图中的彩色区域"},click:()=>window.open(new URL(p.u,location.href).href,"_blank","noopener")});
 }}).addTo(map); map.fitBounds(layer.getBounds(),{padding:[24,24]});
}).catch(()=>{status.textContent="边界数据暂时无法加载，请刷新页面"});
</script></body></html>
